<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هاوکار — چوونەژوورەوە</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans Arabic', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    direction: rtl;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 440px;
    padding: 40px 30px;
    text-align: center;
  }
  .logo {
    font-size: 50px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 26px;
    color: #1E293B;
    margin-bottom: 6px;
  }
  .sub {
    color: #64748B;
    font-size: 14px;
    margin-bottom: 26px;
  }
  .tabs {
    display: flex;
    background: #F1F5F9;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    border-radius: 9px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #64748B;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: #fff;
    color: #D97706;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .field {
    margin-bottom: 14px;
    text-align: right;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #E2E8F0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    background: #F8FAFC;
    transition: 0.2s;
  }
  .field input:focus, .field select:focus {
    border-color: #D97706;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(217,119,6,0.12);
  }
  .btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #D97706 0%, #F59E0B 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    transition: 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(217,119,6,0.4); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .msg {
    margin-top: 14px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    text-align: right;
  }
  .msg.show { display: block; }
  .msg.err { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
  .msg.ok { background: #D1FAE5; color: #065F46; border: 1px solid #6EE7B7; }
  .success-box {
    text-align: center;
    padding: 20px 0;
  }
  .success-box .icon {
    width: 80px; height: 80px;
    background: #10B981;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: #fff;
    margin-bottom: 16px;
  }
  .success-box h2 {
    color: #1E293B;
    margin-bottom: 10px;
  }
  .success-box p {
    color: #64748B;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 16px;
  }
  .phone-show {
    display: inline-block;
    background: #FEF3C7;
    color: #B45309;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 16px;
    border: 1px dashed #D97706;
    direction: ltr;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="logo">🎓</div>
  <h1>هاوکار</h1>
  <p class="sub">سیستەمی هەڵبژاردنی بەشی زانکۆ</p>

  <div class="tabs">
    <button class="tab active" data-tab="login">چوونەژوورەوە</button>
    <button class="tab" data-tab="register">خۆتۆمارکردن</button>
  </div>

  <!-- چوونەژوورەوە -->
  <div class="panel active" id="panel-login">
    <div class="field">
      <label>ناوی بەکارهێنەر</label>
      <input type="text" id="loginUser" placeholder="ناوی بەکارهێنەر...">
    </div>
    <div class="field">
      <label>پاسۆرد</label>
      <input type="password" id="loginPass" placeholder="پاسۆرد...">
    </div>
    <button class="btn" id="loginBtn">چوونەژوورەوە</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- خۆتۆمارکردن -->
  <div class="panel" id="panel-register">
    <div class="field">
      <label>ناوی تەواو</label>
      <input type="text" id="regName" placeholder="ناوی تەواوت...">
    </div>
    <div class="field">
      <label>ژمارەی مۆبایل</label>
      <input type="tel" id="regPhone" placeholder="07XXXXXXXXX" maxlength="11">
    </div>
    <div class="field">
      <label>لقی خوێندن</label>
      <select id="regBranch">
        <option value="">— هەڵبژێرە —</option>
        <option value="زانستی">زانستی</option>
        <option value="وێژەیی">وێژەیی</option>
      </select>
    </div>
    <div class="field">
      <label>ناوی بەکارهێنەری دڵخواز</label>
      <input type="text" id="regUsername" placeholder="بە ئینگلیزی...">
    </div>
    <button class="btn" id="registerBtn">ناردنی داواکاری</button>
    <div class="msg" id="registerMsg"></div>
  </div>
</div>

<script>
  const HOME_PAGE = "Home (1).html";
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxbVXlH_MV75QXc5tSBPGr0D7jbS48UUBKigctPf3-v0T6xlXk2MrEBHm27nqtw-q8zTtc766cdwho/pub?gid=0&single=true&output=csv";
  
  // ⚠️ لینکی Apps Script لێرە دابنێ
  const API_URL = "https://script.google.com/a/macros/uor.edu.krd/s/AKfycbyBjDi8ZRpyfkjCHkSmX9iTdqBXe9Wom_ctqO-UGuK34Pa_sipUMjuR9Hix2nOr_Sbe/exec";

  // ئەگەر پێشتر لۆگین کردووە
  if (localStorage.getItem("userLoggedIn") === "true") {
    window.location.replace(HOME_PAGE);
  }

  // تابەکان
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('panel-' + t.dataset.tab).classList.add('active');
      document.getElementById('loginMsg').className = 'msg';
      document.getElementById('registerMsg').className = 'msg';
    });
  });

  // بارکردنی بەکارهێنەران
  let users = [];
  async function loadUsers() {
    try {
      const res = await fetch(CSV_URL + "&t=" + Date.now());
      const text = await res.text();
      const rows = text.split('\n').map(r => r.trim()).filter(r => r);
      users = rows.slice(1).map(row => {
        const c = row.split(',').map(x => x.replace(/^"(.*)"$/, '$1').trim());
        return { username: c[0] || '', password: c[1] || '' };
      }).filter(u => u.username && u.password);
    } catch (e) {
      console.error(e);
    }
  }
  loadUsers();

  // چوونەژوورەوە
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMsg');

    if (!u || !p) {
      msg.className = 'msg show err';
      msg.textContent = '⚠️ ناوی بەکارهێنەر و پاسۆرد پڕبکەرەوە';
      return;
    }

    if (users.length === 0) await loadUsers();

    const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);

    if (found) {
      localStorage.setItem("userLoggedIn", "true");
      localStorage.setItem("activeUser", found.username);
      msg.className = 'msg show ok';
      msg.textContent = '✅ چوونەژوورەوە سەرکەوتوو بوو...';
      setTimeout(() => window.location.replace(HOME_PAGE), 700);
    } else {
      msg.className = 'msg show err';
      msg.textContent = '❌ ناوی بەکارهێنەر یان پاسۆرد هەڵەیە';
    }
  });

  // Enter بۆ لۆگین
  document.getElementById('loginPass').addEventListener('keypress', e => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  // خۆتۆمارکردن
  document.getElementById('registerBtn').addEventListener('click', async () => {
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const branch = document.getElementById('regBranch').value;
    const username = document.getElementById('regUsername').value.trim();
    const msg = document.getElementById('registerMsg');
    const btn = document.getElementById('registerBtn');

    if (!name || !phone || !branch || !username) {
      msg.className = 'msg show err';
      msg.textContent = '⚠️ هەموو خانەکان پڕبکەرەوە';
      return;
    }

    if (!/^07\d{9}$/.test(phone)) {
      msg.className = 'msg show err';
      msg.textContent = '⚠️ ژمارەکە دەبێت بە شێوەی 07XXXXXXXXX بێت';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'دەنێردرێت...';

    try {
      // ناردن بۆ Google Apps Script
      const form = new URLSearchParams();
      form.append('name', name);
      form.append('phone', phone);
      form.append('branch', branch);
      form.append('username', username);

      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: form.toString()
      });

      // پیشاندانی شاشەی سەرکەوتن
      document.getElementById('mainCard').innerHTML = `
        <div class="success-box">
          <div class="icon">✓</div>
          <h2>داواکارییەکەت نێردرا!</h2>
          <p>بەڕێوەبەر داتاکانت وەردەگرێت<br>و پاسۆردەکەت بۆ دەنێردرێت لەسەر:</p>
          <div class="phone-show">${phone}</div>
          <p style="font-size:13px;">دوای وەرگرتنی پاسۆرد، بگەڕێوە و بچۆ ژوورەوە.</p>
          <button class="btn" onclick="location.reload()" style="margin-top:16px;">گەڕانەوە</button>
        </div>
      `;

    } catch (err) {
      msg.className = 'msg show err';
      msg.textContent = '❌ هەڵە ڕوویدا. دووبارە هەوڵبدەوە';
      btn.disabled = false;
      btn.textContent = 'ناردنی داواکاری';
    }
  });

  // تەنها ژمارە
  document.getElementById('regPhone').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
  });
</script>

</body>
</html>
