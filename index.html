<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JiGa - جێگا — سیستەمی زیرەکی هەڵبژاردنی بەشی زانکۆ و پەیمانگاکان - چوونەژوورەوە</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400..700&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #1E293B;
    --accent: #D97706;
    --accent-hover: #B45309;
    --accent-soft: #FEF3C7;
    --bg-main: #F8FAFC;
    --card-bg: #FFFFFF;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --danger: #EF4444;
    --success: #10B981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: linear-gradient(135deg, #F8FAFC 0%, #E0E7FF 100%);
    color: var(--text-main);
    font-family: 'Noto Sans Arabic', sans-serif;
    line-height: 1.6;
    direction: rtl;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(217,119,6,0.15) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(30,41,59,0.1) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  .auth-wrapper {
    width: 100%;
    max-width: 460px;
    position: relative;
    z-index: 1;
  }

  .auth-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.03);
    padding: 40px 32px;
    text-align: center;
    animation: fadeInUp 0.5s ease-out;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 70px; height: 70px;
    background: linear-gradient(135deg, var(--accent) 0%, #F59E0B 100%);
    border-radius: 20px;
    margin-bottom: 16px;
    font-size: 34px;
    box-shadow: 0 10px 25px -5px rgba(217,119,6,0.4);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .logo-text {
    font-size: 28px;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 6px;
    font-family: 'Noto Naskh Arabic', serif;
  }

  .tagline {
    color: var(--text-muted);
    font-size: 13.5px;
    margin-bottom: 28px;
  }

  .tabs {
    display: flex;
    background: var(--bg-main);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
  }

  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    background: transparent;
    border: none;
    border-radius: 9px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s;
  }

  .tab-btn.active {
    background: var(--card-bg);
    color: var(--primary);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.3s; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .auth-field { margin-bottom: 16px; text-align: right; }

  .auth-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 7px;
  }

  .auth-field label .req { color: var(--danger); margin-right: 2px; }

  .input-wrap { position: relative; }

  .input-wrap .icon {
    position: absolute;
    top: 50%; right: 14px;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.5;
    pointer-events: none;
  }

  .auth-field input,
  .auth-field select {
    width: 100%;
    padding: 12px 42px 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
    background: #FCFCFD;
    color: var(--text-main);
  }

  .auth-field select {
    padding-right: 14px;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: left 12px center;
    background-size: 16px;
  }

  .auth-field input:focus,
  .auth-field select:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(217,119,6,0.12);
  }

  .auth-field input::placeholder { color: #94A3B8; }

  .auth-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent) 0%, #F59E0B 100%);
    color: #fff;
    border: none;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
    margin-top: 8px;
    box-shadow: 0 8px 20px -6px rgba(217,119,6,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .auth-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -6px rgba(217,119,6,0.6);
  }

  .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .msg {
    font-size: 13px;
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
    text-align: right;
    line-height: 1.5;
  }

  .msg.err { color: #991B1B; background: #FEE2E2; border: 1px solid #FCA5A5; display: block; }
  .msg.ok  { color: #065F46; background: #D1FAE5; border: 1px solid #6EE7B7; display: block; }

  .success-screen { text-align: center; padding: 20px 0; }

  .success-screen .check-icon {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #10B981 0%, #34D399 100%);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: #fff;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px -8px rgba(16,185,129,0.5);
    animation: pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .success-screen h2 {
    font-size: 22px;
    color: var(--primary);
    margin-bottom: 10px;
    font-family: 'Noto Naskh Arabic', serif;
  }

  .success-screen p {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 8px;
    line-height: 1.7;
  }

  .phone-box {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent-hover);
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 16px;
    margin: 12px 0 18px;
    border: 1px dashed var(--accent);
  }

  .helper-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo-badge">🎓</div>
    <div class="logo-text">Jiga - جێگا</div>
    <p class="tagline">سیستەمی زیرەکی هەڵبژاردنی بەشی زانکۆ و پەیمانگاکان</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">چوونەژوورەوە</button>
      <button class="tab-btn" data-tab="register">خۆتۆمارکردن</button>
    </div>

    <!-- تاب: چوونەژوورەوە -->
    <div class="tab-panel active" id="panel-login">
      <div class="auth-field">
        <label>ناوی بەکارهێنەر <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="text" id="loginUser" placeholder="ناوی بەکارهێنەر..." autocomplete="off">
          <span class="icon">👤</span>
        </div>
      </div>

      <div class="auth-field">
        <label>پاسۆرد <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="password" id="loginPass" placeholder="پاسۆرد...">
          <span class="icon">🔒</span>
        </div>
      </div>

      <button class="auth-btn" id="loginBtn">چوونەژوورەوە ←</button>
      <div class="msg" id="loginMsg"></div>

      <div class="helper-note">
        💡 پاسۆردەکەت لەلایەن بەڕێوەبەر بۆ دەنێردرێت دوای خۆتۆمارکردن.
      </div>
    </div>

    <!-- تاب: خۆتۆمارکردن -->
    <div class="tab-panel" id="panel-register">
      <div class="auth-field">
        <label>ناوی تەواو <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="text" id="regName" placeholder="ناوی تەواوت..." autocomplete="off">
          <span class="icon">👤</span>
        </div>
      </div>

      <div class="auth-field">
        <label>ژمارەی مۆبایل <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="tel" id="regPhone" placeholder="07XXXXXXXXX" autocomplete="off" maxlength="11">
          <span class="icon">📱</span>
        </div>
      </div>

      <div class="auth-field">
        <label>لقی خوێندن <span class="req">*</span></label>
        <div class="input-wrap">
          <select id="regBranch">
            <option value="">— هەڵبژێرە —</option>
            <option value="زانستی">زانستی</option>
            <option value="وێژەیی">وێژەیی</option>
          </select>
        </div>
      </div>

      <div class="auth-field">
        <label>ناوی بەکارهێنەری دڵخواز <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="text" id="regUsername" placeholder="بە ئینگلیزی (3-20 پیت)..." autocomplete="off">
          <span class="icon">@</span>
        </div>
      </div>

      <button class="auth-btn" id="registerBtn">ناردنی داواکاری 📨</button>
      <div class="msg" id="registerMsg"></div>

      <div class="helper-note">
        📌 دوای ناردنی داواکاری، بەڕێوەبەر پاسۆردەکەت لەڕێگەی whatsapp یان SMS  بۆ دەنێرێت و ئەکاونتەکەت چالاک دەکرێت.
      </div>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     ⚙️ ڕێکخستنەکان — لێرە بگۆڕە
     ============================================================ */
  const HOME_PAGE = "Home.html";   // ناوی پەیجی سەرەکی

  // ⚠️ لێرە URL ی Google Apps Script دابنێ
  const API_URL = "https://script.google.com/macros/s/AKfycby8n7BNVatXcCQ3-JHza5hQAA67HPqeoZyGMOH_pJ3DqtY4p4v_tLHwVKexazyPLbm4/exec";

  /* ============================================================
     ئەگەر پێشتر لۆگین کردووە، ڕاستەوخۆ بڕۆ بۆ Home
     ============================================================ */
  if (localStorage.getItem("userLoggedIn") === "true") {
    window.location.replace(HOME_PAGE);
  }

  /* ============================================================
     تابەکان
     ============================================================ */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      document.getElementById('loginMsg').className = 'msg';
      document.getElementById('loginMsg').textContent = '';
      document.getElementById('registerMsg').className = 'msg';
      document.getElementById('registerMsg').textContent = '';
    });
  });

  /* ============================================================
     ناردنی داواکاری بۆ Apps Script
     ============================================================ */
  async function callApi(params) {
    // بە URLSearchParams دەنێرین (Apps Script پشتگیری دەکات)
    const body = new URLSearchParams(params).toString();
    const response = await fetch(API_URL, {
      method: "POST",
      body: body,
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      redirect: "follow"
    });
    return response.json();
  }

  /* ============================================================
     چوونەژوورەوە
     ============================================================ */
  const loginBtn = document.getElementById('loginBtn');
  const loginMsg = document.getElementById('loginMsg');

  loginBtn.addEventListener('click', async () => {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();

    if (!username || !password) {
      loginMsg.className = 'msg err';
      loginMsg.textContent = '⚠️ تکایە ناوی بەکارهێنەر و پاسۆرد پڕبکەرەوە.';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span> چاوەڕوان بە...';

    try {
      const result = await callApi({
        action: "login",
        username: username,
        password: password
      });

      if (result.result === "success") {
        localStorage.setItem("userLoggedIn", "true");
        localStorage.setItem("activeUser", result.user.username);
        localStorage.setItem("activeName", result.user.name || "");
        localStorage.setItem("activeBranch", result.user.branch || "");

        loginMsg.className = 'msg ok';
        loginMsg.textContent = '✅ بەسەرکەوتوویی چوونەژوورەوە! دەگوازرێیتەوە...';
        setTimeout(() => window.location.replace(HOME_PAGE), 800);
      } else {
        loginMsg.className = 'msg err';
        loginMsg.textContent = '❌ ' + (result.message || 'هەڵەیەک ڕوویدا');
      }
    } catch (err) {
      console.error(err);
      loginMsg.className = 'msg err';
      loginMsg.textContent = '❌ نەتوانرا پەیوەندی بکرێت. تکایە دووبارە هەوڵبدەوە.';
    } finally {
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'چوونەژوورەوە ←';
    }
  });

  document.getElementById('loginPass').addEventListener('keypress', e => {
    if (e.key === 'Enter') loginBtn.click();
  });

  /* ============================================================
     خۆتۆمارکردن
     ============================================================ */
  const registerBtn = document.getElementById('registerBtn');
  const registerMsg = document.getElementById('registerMsg');

  document.getElementById('regPhone').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
  });

  document.getElementById('regUsername').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
  });

  registerBtn.addEventListener('click', async () => {
    const name     = document.getElementById('regName').value.trim();
    const phone    = document.getElementById('regPhone').value.trim();
    const branch   = document.getElementById('regBranch').value;
    const username = document.getElementById('regUsername').value.trim();

    if (!name || !phone || !branch || !username) {
      registerMsg.className = 'msg err';
      registerMsg.textContent = '⚠️ تکایە هەموو خانەکان پڕبکەرەوە.';
      return;
    }
    if (!/^07\d{9}$/.test(phone)) {
      registerMsg.className = 'msg err';
      registerMsg.textContent = '⚠️ ژمارەی مۆبایل دەبێت بە شێوەی 07XXXXXXXXX بێت.';
      return;
    }
    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
      registerMsg.className = 'msg err';
      registerMsg.textContent = '⚠️ ناوی بەکارهێنەر دەبێت 3-20 پیت بێت.';
      return;
    }

    registerBtn.disabled = true;
    registerBtn.innerHTML = '<span class="spinner"></span> دەنێردرێت...';

    try {
      const result = await callApi({
        action: "register",
        name: name,
        phone: phone,
        branch: branch,
        username: username
      });

      if (result.result === "success") {
        showSuccessScreen(name, phone);
      } else {
        registerMsg.className = 'msg err';
        registerMsg.textContent = '❌ ' + (result.message || 'هەڵەیەک ڕوویدا');
        registerBtn.disabled = false;
        registerBtn.innerHTML = 'ناردنی داواکاری 📨';
      }
    } catch (err) {
      console.error(err);
      registerMsg.className = 'msg err';
      registerMsg.textContent = '❌ نەتوانرا پەیوەندی بکرێت. تکایە دووبارە هەوڵبدەوە.';
      registerBtn.disabled = false;
      registerBtn.innerHTML = 'ناردنی داواکاری 📨';
    }
  });

  /* ============================================================
     شاشەی سەرکەوتن
     ============================================================ */
  function showSuccessScreen(name, phone) {
    document.querySelector('.auth-card').innerHTML = `
      <div class="success-screen">
        <div class="check-icon">✓</div>
        <h2>داواکارییەکەت نێردرا!</h2>
        <p>بەڕێوەبەر داتاکانت وەردەگرێت و<br>پاسۆردەکەت بۆ دەنێردرێت لەسەر ژمارەکەت:</p>
        <div class="phone-box" dir="ltr">${phone}</div>
        <p style="font-size:13px;">دوای وەرگرتنی پاسۆرد، بگەڕێوە و بچۆ ژوورەوە.</p>
        <button class="auth-btn" style="margin-top:20px;" onclick="location.reload()">گەڕانەوە بۆ لاپەڕەی سەرەکی</button>
      </div>
    `;
  }
</script>

</body>
</html>
